# GM toolkit (Python), mod build, unit tests and GameTest (NeoForge server, ~1 min); jar in artifacts.
# Manual run on main with release=true: checks, then a GitHub release v<mod_version> with this jar and notes
# from docs/releases/<mod_version>.md.
name: build

# Each commit is checked once: branches via pull_request (which decides merging), main via push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Create release v<mod_version> (main only)
        type: boolean
        default: false

# A push cancels the previous build of that branch; a manual release has its own group, unaffected by pushes to main.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-{0}', github.run_id) || format('build-{0}', github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Сборка и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: GM toolkit (mcp/gm)
        run: python3 -m unittest discover -s mcp/gm/tests

      - name: MCP adapter syntax
        run: python3 -m py_compile mcp/almighty.py

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Chat channel syntax
        working-directory: mcp/gm/almighty-chat
        run: node --check almighty-chat.mjs

      - name: Chat routing tests
        working-directory: mcp/gm/almighty-chat
        run: node --test

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and unit tests
        run: ./gradlew build --console=plain

      - uses: actions/upload-artifact@v6
        with:
          name: almighty-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: GameTest
        run: |
          ./gradlew runGameTestServer --console=plain
          grep -E 'All [0-9]+ required tests passed' run/gametest/logs/latest.log

      - name: Reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: |
            build/reports/
            run/gametest/logs/
          if-no-files-found: ignore

  release:
    name: Релиз
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: almighty-jar
          path: build/libs
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^mod_version=//p' gradle.properties)
          gh release create "v$v" build/libs/*.jar --target "$GITHUB_SHA" \
            --title "Almighty $v" --notes-file "docs/releases/$v.md"
