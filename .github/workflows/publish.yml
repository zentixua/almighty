# Modrinth and CurseForge pages: manual runs only (Actions → publish → Run workflow), in steps:
#   draft   — Modrinth: create a draft page if absent, or update it from docs/store, with the repository's existing
#             icon and gallery, and the release's jars; visible only to the project team. Safe to repeat.
#   submit  — Modrinth: submit the draft for review; CurseForge: the release's jars (the first file submits the project
#             for review).
#   release — a new release after review: Modrinth page from docs/store, jars to Modrinth and CurseForge.
# A release carries one jar per game version and loader, almighty-<version>+<game version>-<loader>.jar (the build
# workflow's nodes, versions/*); each becomes its own file with its game version, loader and Java version.
# Release: v<version> on GitHub (build workflow with release=true); empty means latest. Notes: docs/releases/<version>.md
# from the run's branch, or the release body if absent. Skip Modrinth without MODRINTH_TOKEN; skip CurseForge without
# CURSEFORGE_TOKEN or the CURSEFORGE_ID variable (create the CurseForge project manually on the site).
# Fields and images: docs/store/modrinth.json; listing: docs/store/listing.md ("Publishing").
name: publish
run-name: publish ${{ inputs.step }} ${{ inputs.version || '(latest release)' }}

on:
  workflow_dispatch:
    inputs:
      step:
        description: "draft — Modrinth draft; submit — send for review (and CurseForge); release — new release"
        type: choice
        options: [draft, submit, release]
        default: draft
      version:
        description: GitHub release without "v" (1.0.0); empty means latest
        type: string
        required: false

# Concurrent runs must not create the project twice.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Release files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.rel.outputs.version }}
      environment: ${{ steps.rel.outputs.environment }}
      files: ${{ steps.rel.outputs.files }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          STEP: ${{ inputs.step }}
          HAS_MODRINTH: ${{ secrets.MODRINTH_TOKEN != '' }}
          HAS_CURSEFORGE: ${{ secrets.CURSEFORGE_TOKEN != '' && vars.CURSEFORGE_ID != '' }}
        run: |
          v=${VERSION#v}
          [ -n "$v" ] || v=$(gh release view --json tagName -q .tagName | sed 's/^v//')
          case $v in ''|*[!0-9A-Za-z.+-]*) echo "::error::Version $v is not a release number"; exit 1 ;; esac
          mkdir -p dist
          gh release download "v$v" --pattern "almighty-$v+*.jar" --dir dist
          if [ -f "docs/releases/$v.md" ]; then
            cp "docs/releases/$v.md" dist/changelog.md
            notes="docs/releases/$v.md ($GITHUB_REF_NAME)"
          else
            gh release view "v$v" --json body -q .body > dist/changelog.md
            notes="release body v$v"
          fi
          # One entry per jar: almighty-<v>+<game>-<loader>.jar. Java and the optional mods come from the node's
          # versions/<node>/gradle.properties (compat_<mod> = a build of that mod exists there); without the node,
          # Java 21 before 26.1, 25 from 26.1, and no optional mods. Fabric files require Fabric API.
          files=$(for f in dist/almighty-"$v"+*.jar; do
            b=$(basename "$f" .jar); node=${b#almighty-"$v"+}; game=${node%-*}; loader=${node##*-}
            props=versions/$node/gradle.properties
            prop() { [ -f "$props" ] && sed -n "s/^$1=//p" "$props" | head -n 1; }
            java=$(prop java_version || true)
            [ -n "$java" ] || case $game in 1.*) java=21 ;; *) java=25 ;; esac
            deps=$({
              [ "$loader" != fabric ] || echo 'fabric-api(required){modrinth:fabric-api}{curseforge:fabric-api}'
              # Permission nodes: NeoForge's permission API or fabric-permissions-api; LuckPerms implements both.
              echo 'luckperms(optional){modrinth:luckperms}{curseforge:luckperms}'
              [ -z "$(prop compat_ia)" ] ||
                echo 'immersive-aircraft(optional){modrinth:immersive-aircraft}{curseforge:immersive-aircraft}'
              [ -z "$(prop compat_sable)" ] || echo 'sable(optional){modrinth:sable}{curseforge:sable}'
              [ -z "$(prop compat_opac)" ] ||
                echo 'open-parties-and-claims(optional){modrinth:open-parties-and-claims}{curseforge:open-parties-and-claims}'
              # FTB Chunks is on CurseForge only, one project per loader.
              [ -z "$(prop compat_ftbchunks)" ] || case $loader in
                fabric) echo 'ftb-chunks(optional){curseforge:ftb-chunks-fabric}#(ignore:modrinth)' ;;
                *) echo 'ftb-chunks(optional){curseforge:ftb-chunks-forge}#(ignore:modrinth)' ;;
              esac
            })
            jq -nc --arg f "$(basename "$f")" --arg g "$game" --arg l "$loader" --arg j "$java" --arg d "$deps" \
              '{file: $f, game: $g, loader: $l, java: $j, dependencies: $d}'
          done | jq -sc .)
          [ "$(jq length <<< "$files")" -gt 0 ] || { echo "::error::Release v$v has no almighty-$v+*.jar"; exit 1; }
          # Version environment for Modrinth and CurseForge from the page's client_side/server_side.
          environment=$(jq -r '[(.client_side | {required: "client", optional: "client?"}[.] // empty),
            (.server_side | {required: "server", optional: "server?"}[.] // empty)] | join(" | ")' docs/store/modrinth.json)
          {
            echo "version=$v"
            echo "environment=$environment"
            echo "files=$files"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Almighty $v, step $STEP; notes — $notes"
            jq -r '.[] | "- \(.file): \(.game) \(.loader), Java \(.java); \(.dependencies | split("\n") | map(split("(")[0]) | join(", "))"' <<< "$files"
            [ "$HAS_MODRINTH" = true ] || echo "- Modrinth skipped: missing MODRINTH_TOKEN secret"
            [ "$STEP" = draft ] || [ "$HAS_CURSEFORGE" = true ] ||
              echo "- CurseForge skipped: missing CURSEFORGE_TOKEN secret or CURSEFORGE_ID variable"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$HAS_MODRINTH" = true ] || echo "::notice::Modrinth skipped: missing MODRINTH_TOKEN secret"
          [ "$STEP" = draft ] || [ "$HAS_CURSEFORGE" = true ] ||
            echo "::notice::CurseForge skipped: missing CURSEFORGE_TOKEN secret or CURSEFORGE_ID variable"

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  page:
    name: Modrinth page
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_MODRINTH: ${{ secrets.MODRINTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: "Modrinth: page"
        if: env.HAS_MODRINTH == 'true' && inputs.step != 'submit'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          STEP: ${{ inputs.step }}
        run: bash .github/scripts/modrinth.sh page "$STEP"

  # submit: Modrinth review first; its failure stops the run before CurseForge, so a retry does not upload there twice.
  submit:
    name: "Modrinth: submit for review"
    needs: plan
    if: inputs.step == 'submit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_MODRINTH: ${{ secrets.MODRINTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: "Modrinth: submit"
        if: env.HAS_MODRINTH == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: bash .github/scripts/modrinth.sh submit

  # One file per game version and loader, one at a time (Modrinth lists them in upload order). Every Modrinth file
  # first, then CurseForge: a Modrinth failure on any file stops the run before CurseForge gets anything, so a
  # retry never uploads a file to CurseForge twice (Modrinth itself skips jars it already has, by sha1).
  modrinth:
    name: "Modrinth: ${{ matrix.f.game }} ${{ matrix.f.loader }}"
    needs: [plan, page, submit]
    if: >-
      always() && needs.plan.result == 'success' && needs.page.result == 'success'
      && (needs.submit.result == 'success' || needs.submit.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        f: ${{ fromJSON(needs.plan.outputs.files) }}
    env:
      HAS_MODRINTH: ${{ secrets.MODRINTH_TOKEN != '' }}
      JAR: dist/${{ matrix.f.file }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: "Modrinth: already uploaded?"
        id: up
        if: env.HAS_MODRINTH == 'true' && inputs.step != 'submit'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: bash .github/scripts/modrinth.sh uploaded "$JAR"

      # Kira-NT/mc-publish v3.3.1, pinned by commit: it receives tokens; skip a platform without its token.
      - name: "Modrinth: version"
        if: steps.up.outputs.upload == 'true'
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: ${{ steps.up.outputs.id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ env.JAR }}
          name: Almighty ${{ needs.plan.outputs.version }} (${{ matrix.f.game }} ${{ matrix.f.loader }})
          version: ${{ needs.plan.outputs.version }}+${{ matrix.f.game }}-${{ matrix.f.loader }}
          version-type: release
          changelog-file: dist/changelog.md
          loaders: ${{ matrix.f.loader }}
          game-versions: ${{ matrix.f.game }}
          java: ${{ matrix.f.java }}
          environment: ${{ needs.plan.outputs.environment }}
          dependencies: ${{ matrix.f.dependencies }}

  curseforge:
    name: "CurseForge: ${{ matrix.f.game }} ${{ matrix.f.loader }}"
    needs: [plan, modrinth]
    if: always() && needs.plan.result == 'success' && needs.modrinth.result == 'success' && inputs.step != 'draft'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        f: ${{ fromJSON(needs.plan.outputs.files) }}
    env:
      HAS_CURSEFORGE: ${{ secrets.CURSEFORGE_TOKEN != '' && vars.CURSEFORGE_ID != '' }}
      JAR: dist/${{ matrix.f.file }}
    steps:
      - uses: actions/download-artifact@v7
        if: env.HAS_CURSEFORGE == 'true'
        with:
          name: dist
          path: dist

      - name: CurseForge
        if: env.HAS_CURSEFORGE == 'true'
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ env.JAR }}
          name: Almighty ${{ needs.plan.outputs.version }} (${{ matrix.f.game }} ${{ matrix.f.loader }})
          version: ${{ needs.plan.outputs.version }}+${{ matrix.f.game }}-${{ matrix.f.loader }}
          version-type: release
          changelog-file: dist/changelog.md
          loaders: ${{ matrix.f.loader }}
          game-versions: ${{ matrix.f.game }}
          java: ${{ matrix.f.java }}
          environment: ${{ needs.plan.outputs.environment }}
          dependencies: ${{ matrix.f.dependencies }}
