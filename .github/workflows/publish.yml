# Modrinth and CurseForge pages: manual runs only (Actions → publish → Run workflow), in steps:
#   draft   — Modrinth: create a draft page if absent, or update it from docs/store, with the repository's existing
#             icon and gallery, and the release jar; visible only to the project team. Safe to repeat.
#   submit  — Modrinth: submit the draft for review; CurseForge: release jar (the first file submits the project for review).
#   release — a new release after review: Modrinth page from docs/store, jar to Modrinth and CurseForge.
# Release: v<version> on GitHub (build workflow with release=true); empty means latest. Notes: docs/releases/<version>.md
# from the run's branch, or the release body if absent. Skip Modrinth without MODRINTH_TOKEN; skip CurseForge without
# CURSEFORGE_TOKEN or the CURSEFORGE_ID variable (create the CurseForge project manually on the site).
# Fields and images: docs/store/modrinth.json; listing: docs/store/listing.md ("Publishing").
name: publish
run-name: publish ${{ inputs.step }} ${{ inputs.version || '(latest release)' }}

on:
  workflow_dispatch:
    inputs:
      step:
        description: "draft — Modrinth draft; submit — send for review (and CurseForge); release — new release"
        type: choice
        options: [draft, submit, release]
        default: draft
      version:
        description: GitHub release without "v" (0.4.0); empty means latest
        type: string
        required: false

# Concurrent runs must not create the project twice.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: ${{ inputs.step }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_MODRINTH: ${{ secrets.MODRINTH_TOKEN != '' }}
      HAS_CURSEFORGE: ${{ secrets.CURSEFORGE_TOKEN != '' && vars.CURSEFORGE_ID != '' }}
      # Optional dependencies (absent from mods.toml).
      DEPENDENCIES: |
        immersive-aircraft(optional){modrinth:immersive-aircraft}{curseforge:immersive-aircraft}
        sable(optional){modrinth:sable}{curseforge:sable}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          STEP: ${{ inputs.step }}
        run: |
          v=${VERSION#v}
          [ -n "$v" ] || v=$(gh release view --json tagName -q .tagName | sed 's/^v//')
          case $v in ''|*[!0-9A-Za-z.+-]*) echo "::error::Version $v is not a release number"; exit 1 ;; esac
          mkdir -p dist
          gh release download "v$v" --pattern "almighty-$v.jar" --dir dist
          if [ -f "docs/releases/$v.md" ]; then
            cp "docs/releases/$v.md" dist/changelog.md
            notes="docs/releases/$v.md ($GITHUB_REF_NAME)"
          else
            gh release view "v$v" --json body -q .body > dist/changelog.md
            notes="release body v$v"
          fi
          # Version environment for Modrinth and CurseForge from the page's client_side/server_side.
          environment=$(jq -r '[(.client_side | {required: "client", optional: "client?"}[.] // empty),
            (.server_side | {required: "server", optional: "server?"}[.] // empty)] | join(" | ")' docs/store/modrinth.json)
          {
            echo "version=$v"
            echo "jar=dist/almighty-$v.jar"
            echo "environment=$environment"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Almighty $v, step $STEP; notes — $notes"
            [ "$HAS_MODRINTH" = true ] || echo "- Modrinth skipped: missing MODRINTH_TOKEN secret"
            [ "$STEP" = draft ] || [ "$HAS_CURSEFORGE" = true ] ||
              echo "- CurseForge skipped: missing CURSEFORGE_TOKEN secret or CURSEFORGE_ID variable"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$HAS_MODRINTH" = true ] || echo "::notice::Modrinth skipped: missing MODRINTH_TOKEN secret"
          [ "$STEP" = draft ] || [ "$HAS_CURSEFORGE" = true ] ||
            echo "::notice::CurseForge skipped: missing CURSEFORGE_TOKEN secret or CURSEFORGE_ID variable"

      - name: "Modrinth: page"
        id: page
        if: env.HAS_MODRINTH == 'true' && inputs.step != 'submit'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          STEP: ${{ inputs.step }}
          JAR: ${{ steps.rel.outputs.jar }}
        run: bash .github/scripts/modrinth.sh page "$STEP" "$JAR"

      # Kira-NT/mc-publish v3.3.1, pinned by commit: it receives tokens; skip a platform without its token.
      - name: "Modrinth: version"
        if: steps.page.outputs.upload == 'true'
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: ${{ steps.page.outputs.id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.rel.outputs.jar }}
          name: Almighty ${{ steps.rel.outputs.version }}
          version: ${{ steps.rel.outputs.version }}
          version-type: release
          changelog-file: dist/changelog.md
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          environment: ${{ steps.rel.outputs.environment }}
          dependencies: ${{ env.DEPENDENCIES }}

      - name: "Modrinth: submit for review"
        if: env.HAS_MODRINTH == 'true' && inputs.step == 'submit'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: bash .github/scripts/modrinth.sh submit

      # After Modrinth: its failure stops the run before CurseForge, so a retry does not upload the file there twice.
      - name: CurseForge
        if: env.HAS_CURSEFORGE == 'true' && inputs.step != 'draft'
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.rel.outputs.jar }}
          name: Almighty ${{ steps.rel.outputs.version }}
          version: ${{ steps.rel.outputs.version }}
          version-type: release
          changelog-file: dist/changelog.md
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          environment: ${{ steps.rel.outputs.environment }}
          dependencies: ${{ env.DEPENDENCIES }}
