# Modrinth and CurseForge pages: manual runs only (Actions → publish → Run workflow), in steps:
#   draft   — Modrinth: create a draft page if absent, or update it from docs/store, with the repository's existing
#             icon and gallery, and every node's jar; visible only to the project team. Safe to repeat.
#   submit  — Modrinth: submit the draft for review; CurseForge: every node's jar (the first file submits the project
#             for review).
#   release — a new release after review: Modrinth page from docs/store, every node's jar to Modrinth and CurseForge.
# Release: v<version> on GitHub (build workflow with release=true); empty means latest. One file per node
# (versions/<node>, jar almighty-<version>+<node>.jar), each its own Modrinth version <version>+<node> with that node's
# loader, game version and Java; a node without a jar in the release is skipped. Optional and required dependencies
# come from the node's properties (compat_* keys, Fabric API on Fabric). Notes: docs/releases/<version>.md from the
# run's branch, or the release body if absent. Skip Modrinth without MODRINTH_TOKEN; skip CurseForge without
# CURSEFORGE_TOKEN or the CURSEFORGE_ID variable (create the CurseForge project manually on the site).
# After a failure, use "Re-run failed jobs": a node whose job succeeded is not uploaded to CurseForge again.
# Fields and images: docs/store/modrinth.json; listing: docs/store/listing.md ("Publishing").
name: publish
run-name: publish ${{ inputs.step }} ${{ inputs.version || '(latest release)' }}

on:
  workflow_dispatch:
    inputs:
      step:
        description: "draft — Modrinth draft; submit — send for review (and CurseForge); release — new release"
        type: choice
        options: [draft, submit, release]
        default: draft
      version:
        description: GitHub release without "v" (0.5.0); empty means latest
        type: string
        required: false

# Concurrent runs must not create the project twice.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  HAS_MODRINTH: ${{ secrets.MODRINTH_TOKEN != '' }}
  HAS_CURSEFORGE: ${{ secrets.CURSEFORGE_TOKEN != '' && vars.CURSEFORGE_ID != '' }}

jobs:
  page:
    name: ${{ inputs.step }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.rel.outputs.version }}
      environment: ${{ steps.rel.outputs.environment }}
      nodes: ${{ steps.rel.outputs.nodes }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          STEP: ${{ inputs.step }}
        run: bash .github/scripts/release_nodes.sh "$VERSION" "$STEP"

      - uses: actions/upload-artifact@v6
        with:
          name: publish-dist
          path: dist
          retention-days: 1

      - name: "Modrinth: page"
        if: env.HAS_MODRINTH == 'true' && inputs.step != 'submit'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          STEP: ${{ inputs.step }}
        run: bash .github/scripts/modrinth.sh page "$STEP"

      - name: "Modrinth: submit for review"
        if: env.HAS_MODRINTH == 'true' && inputs.step == 'submit'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: bash .github/scripts/modrinth.sh submit

  files:
    name: ${{ matrix.node.name }}
    needs: page
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.page.outputs.nodes) }}
    env:
      JAR: dist/${{ matrix.node.jar }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: publish-dist
          path: dist

      - name: "Modrinth: jar"
        id: modrinth
        if: env.HAS_MODRINTH == 'true' && inputs.step != 'submit'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: bash .github/scripts/modrinth.sh jar "$JAR"

      # Kira-NT/mc-publish v3.3.1, pinned by commit: it receives tokens; skip a platform without its token.
      - name: "Modrinth: version"
        if: steps.modrinth.outputs.upload == 'true'
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: ${{ steps.modrinth.outputs.id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ env.JAR }}
          name: ${{ matrix.node.title }}
          version: ${{ matrix.node.version }}
          version-type: release
          changelog-file: dist/changelog.md
          loaders: ${{ matrix.node.loader }}
          game-versions: ${{ matrix.node.minecraft }}
          java: ${{ matrix.node.java }}
          environment: ${{ needs.page.outputs.environment }}
          dependencies: ${{ matrix.node.dependencies }}

      # After Modrinth: its failure stops this node before CurseForge, so a retry does not upload the file there twice.
      - name: CurseForge
        if: env.HAS_CURSEFORGE == 'true' && inputs.step != 'draft'
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ env.JAR }}
          name: ${{ matrix.node.title }}
          version: ${{ matrix.node.version }}
          version-type: release
          changelog-file: dist/changelog.md
          loaders: ${{ matrix.node.loader }}
          game-versions: ${{ matrix.node.minecraft }}
          java: ${{ matrix.node.java }}
          environment: ${{ needs.page.outputs.environment }}
          dependencies: ${{ matrix.node.dependencies }}
