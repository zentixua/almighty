// Almighty: an AI agent's (game master's) bridge to a Minecraft server; server only, not needed by players.
// One Stonecutter node on Fabric (versions/<version>-fabric): the shared source in the root src/. Fabric only on 26.x,
// where the game is unobfuscated and Loom does not remap.
plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom'
}

group = 'ua.zentix.almighty'

base { archivesName = "almighty" }
// almighty-<mod version>+<game version>-fabric.jar: one jar per node.
version = "${mod_version}+${minecraft_version}-fabric"

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

// GameTest is for Gradle runs only; not included in the jar.
// Loom puts the game and Fabric API on main only: devtest takes main's classpaths (as Fabric API's own test mods).
// On Fabric the tests are their own mod (src/fabric/devtest/fabric.mod.json, id almighty_gametest): a production
// fabric.mod.json cannot name test entry points.
sourceSets {
    devtest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        resources.srcDir rootProject.file('src/fabric/devtest')
    }
    // Unit tests bootstrap the game first (src/fabric/test registers ua.zentix.almighty.fabric.GameBootstrap).
    test {
        resources.srcDir rootProject.file('src/fabric/test')
    }
}
configurations {
    devtestCompileOnly.extendsFrom compileOnly
    devtestImplementation.extendsFrom implementation
    devtestRuntimeOnly.extendsFrom runtimeOnly
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://maven.ftb.dev/releases' } }
        filter { includeGroupAndSubgroups 'dev.ftb.mods' }
    }
}

loom {
    // Members NeoForge's access transformers open and the core uses (src/fabric/resources/almighty.classtweaker).
    accessWidenerPath = rootProject.file('src/fabric/resources/almighty.classtweaker')
    runs {
        // Dedicated server with the bridge: ./gradlew :<node>:runServer
        server {
            server()
            runDir "../../run/${project.name}/server"
            programArgs '--nogui'
        }
        // GameTest: Fabric API's headless test server (fabric-api.gametest), only this mod's tests.
        gametest {
            server()
            source sourceSets.devtest
            runDir "../../run/${project.name}/gametest"
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${rootProject.file("run/${project.name}/gametest/report.xml")}"
        }
    }
    mods {
        almighty {
            sourceSet sourceSets.main
        }
        almighty_gametest {
            sourceSet sourceSets.devtest
        }
    }
}

// A fresh GameTest world each run, as in CI.
tasks.matching { it.name == 'runGametest' }.configureEach { task ->
    doFirst { project.delete(rootProject.file("run/${project.name}/gametest/world")) }
}
tasks.register('runGameTestServer') {
    group = 'verification'
    description = 'GameTest on a headless Fabric server (same name as the NeoForge nodes, for CI).'
    dependsOn 'runGametest'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // GM scripts (Groovy) and the TOML of config/almighty-common.toml and policy.toml (NightConfig, which NeoForge
    // ships and Fabric does not): nested jars in the mod jar (Jar-in-Jar).
    implementation("org.apache.groovy:groovy:${groovy_version}")
    include("org.apache.groovy:groovy:${groovy_version}")
    implementation("com.electronwill.night-config:core:${night_config_version}")
    include("com.electronwill.night-config:core:${night_config_version}")
    implementation("com.electronwill.night-config:toml:${night_config_version}")
    include("com.electronwill.night-config:toml:${night_config_version}")

    // Permission nodes: lucko's fabric-permissions-api (LuckPerms implements it), called only when installed.
    compileOnly "me.lucko:fabric-permissions-api:${fabric_permissions_version}"

    // Mod compatibility (compat/<mod>), compile only; see build.neoforge.gradle.
    if (project.findProperty('compat_ia')) {
        compileOnly "maven.modrinth:immersive-aircraft:${compat_ia}"
        devtestRuntimeOnly "maven.modrinth:immersive-aircraft:${compat_ia}"
    }
    if (project.findProperty('compat_opac')) compileOnly "maven.modrinth:open-parties-and-claims:${compat_opac}"
    if (project.findProperty('compat_ftbchunks')) {
        def (chunks, library, teams) = compat_ftbchunks.split(':')
        compileOnly("dev.ftb.mods:ftb-chunks-fabric:${chunks}") { transitive = false }
        compileOnly("dev.ftb.mods:ftb-library-fabric:${library}") { transitive = false }
        compileOnly("dev.ftb.mods:ftb-teams-fabric:${teams}") { transitive = false }
    }

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Compile scope: the game bootstrap is a launcher session listener (ua.zentix.almighty.fabric.GameBootstrap).
    testImplementation 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    var replaceProperties = [
        minecraft_version_range: minecraft_version_range, fabric_loader_version: fabric_loader_version,
        mod_version: mod_version, mod_license: mod_license, mod_authors: mod_authors, mod_url: mod_url,
        // At least the Fabric API built against (its version without the "+<game>" build part).
        fabric_api_min: fabric_api_version.split('\\+')[0],
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') { expand replaceProperties }
    exclude 'META-INF/neoforge.mods.toml'
}
sourceSets.main.resources.srcDir rootProject.file('src/fabric/resources')

tasks.named('jar', Jar) {
    from(rootProject.file('LICENSE'))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all,-processing,-serial,-classfile,-this-escape', '-Xmaxerrs', '1000']
}
