// Мод ведущего: мост к серверу для ведущего-Claude (только сервер, игрокам не нужен). Свой jar airstrike-gm-<версия>.jar;
// свойства (версии NeoForge, Parchment) — общие, из mod/gradle.properties. Запуски названы runGm*, чтобы
// ./gradlew runGameTestServer в mod/ по-прежнему запускал только GameTest Airstrike.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

version = gm_version
group = 'ua.zentix.airstrikegm'

base { archivesName = 'airstrike-gm' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// GameTest — только для запусков из Gradle, в jar не входят
sourceSets {
    devtest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    devtestCompileOnly.extendsFrom compileOnly
    devtestImplementation.extendsFrom implementation
}

repositories {
    mavenCentral()
}

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        // выделенный сервер с мостом (проверка tools/gm.py руками): ./gradlew :gm:runGmServer
        gmServer {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
        gmGameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'airstrike_gm'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        airstrike_gm {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.devtest)
        }
    }
}
neoForge.addModdingDependenciesTo(sourceSets.devtest)
// юнит-тесты моста и плана постройки держат данные в классах игры (Gson, BlockPos)
neoForge.addModdingDependenciesTo(sourceSets.test)

// мир GameTest — каждый раз новый, как в CI
tasks.matching { it.name == 'runGmGameTestServer' }.configureEach { task ->
    doFirst { project.delete(new File(task.gameDirectory.get().asFile, 'world')) }
}

dependencies {
    // скрипты ведущего (Groovy): в jar мода вложенным jar (Jar-in-Jar), в запусках из Gradle — рядом с игрой
    jarJar(implementation('org.apache.groovy:groovy')) {
        version {
            strictly '[4.0.33,5)'
            prefer '4.0.33'
        }
    }
    additionalRuntimeClasspath 'org.apache.groovy:groovy:4.0.33'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version_range: minecraft_version_range, neo_version: neo_version,
        loader_version_range: loader_version_range, gm_version: gm_version,
        mod_license: mod_license, mod_authors: mod_authors, mod_url: mod_url,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all,-processing,-serial,-classfile,-this-escape', '-Xmaxerrs', '1000']
}
