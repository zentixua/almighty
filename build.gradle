// Almighty: мост ИИ-агента (ведущего) к серверу Minecraft — только сервер, игрокам не нужен.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = 'ua.zentix.almighty'

base { archivesName = 'almighty' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// GameTest — только для запусков из Gradle, в jar не входят
sourceSets {
    devtest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    devtestCompileOnly.extendsFrom compileOnly
    devtestImplementation.extendsFrom implementation
}

repositories {
    mavenCentral()
}

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        // выделенный сервер с мостом (проверка mcp/almighty.py руками): ./gradlew runServer
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'almighty'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        almighty {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.devtest)
        }
    }
}
neoForge.addModdingDependenciesTo(sourceSets.devtest)
// юнит-тесты моста и плана постройки держат данные в классах игры (Gson, BlockPos)
neoForge.addModdingDependenciesTo(sourceSets.test)

// мир GameTest — каждый раз новый, как в CI
tasks.matching { it.name == 'runGameTestServer' }.configureEach { task ->
    doFirst { project.delete(new File(task.gameDirectory.get().asFile, 'world')) }
}

dependencies {
    // скрипты ведущего (Groovy): в jar мода вложенным jar (Jar-in-Jar), в запусках из Gradle — рядом с игрой
    jarJar(implementation('org.apache.groovy:groovy')) {
        version {
            strictly '[4.0.33,5)'
            prefer '4.0.33'
        }
    }
    additionalRuntimeClasspath 'org.apache.groovy:groovy:4.0.33'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version_range: minecraft_version_range, neo_version: neo_version,
        loader_version_range: loader_version_range, mod_version: mod_version,
        mod_license: mod_license, mod_authors: mod_authors, mod_url: mod_url,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all,-processing,-serial,-classfile,-this-escape', '-Xmaxerrs', '1000']
}
