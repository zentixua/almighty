// Almighty: an AI agent's (game master's) bridge to a Minecraft server; server only, not needed by players.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = 'ua.zentix.almighty'

base { archivesName = 'almighty' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// GameTest is for Gradle runs only; not included in the jar.
sourceSets {
    devtest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    devtestCompileOnly.extendsFrom compileOnly
    devtestImplementation.extendsFrom implementation
}

repositories {
    mavenCentral()
    // Immersive Aircraft: bot-driven planes (compat/immersiveaircraft), compilation and GameTest;
    // absent from the jar and mods.toml.
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    // Sable companion (MIT), Sable's public library: ships (compat/sable) and GameTest.
    exclusiveContent {
        forRepository { maven { url = 'https://maven.ryanhcode.dev/releases' } }
        filter { includeGroupAndSubgroups 'dev.ryanhcode' }
    }
}

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        // Dedicated server with the bridge (manual mcp/almighty.py check): ./gradlew runServer
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            // Companion mods (IA planes) come from devtestRuntimeOnly.
            sourceSet = sourceSets.devtest
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'almighty'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        almighty {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.devtest)
        }
    }
}
neoForge.addModdingDependenciesTo(sourceSets.devtest)
// Bridge and build-plan unit tests keep data in game classes (Gson, BlockPos).
neoForge.addModdingDependenciesTo(sourceSets.test)

// A fresh GameTest world each run, as in CI.
tasks.matching { it.name == 'runGameTestServer' }.configureEach { task ->
    doFirst { project.delete(new File(task.gameDirectory.get().asFile, 'world')) }
}

dependencies {
    // GM scripts (Groovy): nested jar in the mod jar (Jar-in-Jar), alongside the game in Gradle runs.
    jarJar(implementation('org.apache.groovy:groovy')) {
        version {
            strictly '[4.0.33,5)'
            prefer '4.0.33'
        }
    }
    additionalRuntimeClasspath 'org.apache.groovy:groovy:4.0.33'

    // Immersive Aircraft 1.7.0 (Modrinth version xO17G766): bot aircraft control is called only when the mod is installed.
    compileOnly 'maven.modrinth:immersive-aircraft:xO17G766'
    devtestRuntimeOnly 'maven.modrinth:immersive-aircraft:xO17G766'
    // Sable 2.0.6 (Modrinth version fg9dTRz9; Create Aeronautics ships): ships (compat/sable) use its public
    // sable-companion library (MIT, shipped by Sable itself, absent from our jar and mods.toml); Sable is GameTest-only.
    compileOnly 'dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0'
    devtestCompileOnly 'maven.modrinth:sable:fg9dTRz9'
    devtestRuntimeOnly 'maven.modrinth:sable:fg9dTRz9'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version_range: minecraft_version_range, neo_version: neo_version,
        loader_version_range: loader_version_range, mod_version: mod_version,
        mod_license: mod_license, mod_authors: mod_authors, mod_url: mod_url,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// GPL: include a license copy in every jar shipped to servers.
tasks.named('jar', Jar) {
    from(file('LICENSE'))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all,-processing,-serial,-classfile,-this-escape', '-Xmaxerrs', '1000']
}
