// Almighty: an AI agent's (game master's) bridge to a Minecraft server; server only, not needed by players.
// One Stonecutter node on NeoForge (versions/<version>-neoforge): the shared source in the root src/.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

group = 'ua.zentix.almighty'

base { archivesName = "almighty" }
// almighty-<mod version>+<game version>-neoforge.jar: one jar per node.
version = "${mod_version}+${minecraft_version}-neoforge"

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

// GameTest is for Gradle runs only; not included in the jar.
sourceSets {
    devtest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    devtestCompileOnly.extendsFrom compileOnly
    devtestImplementation.extendsFrom implementation
}

repositories {
    mavenCentral()
    // Immersive Aircraft: bot-driven planes (compat/immersiveaircraft), compilation and GameTest;
    // absent from the jar and mods.toml.
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    // FTB Chunks and its libraries: claims (compat/ftbchunks), compile only.
    exclusiveContent {
        forRepository { maven { url = 'https://maven.ftb.dev/releases' } }
        filter { includeGroupAndSubgroups 'dev.ftb.mods' }
    }
    // Sable companion (MIT), Sable's public library: ships (compat/sable) and GameTest.
    exclusiveContent {
        forRepository { maven { url = 'https://maven.ryanhcode.dev/releases' } }
        filter { includeGroupAndSubgroups 'dev.ryanhcode' }
    }
}

neoForge {
    version = project.neo_version
    // Parameter names on 1.21.1; the game ships unobfuscated with its own names from 26.1.
    if (project.hasProperty('parchment_mappings_version')) {
        parchment {
            mappingsVersion = project.parchment_mappings_version
            minecraftVersion = project.parchment_minecraft_version
        }
    }
    runs {
        // Dedicated server with the bridge (manual mcp/almighty.py check): ./gradlew runServer
        server {
            server()
            gameDirectory = rootProject.file("run/${project.name}/server")
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            // Companion mods (IA planes) come from devtestRuntimeOnly.
            sourceSet = sourceSets.devtest
            gameDirectory = rootProject.file("run/${project.name}/gametest")
            systemProperty 'neoforge.enabledGameTestNamespaces', 'almighty'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        almighty {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.devtest)
        }
    }
}
neoForge.addModdingDependenciesTo(sourceSets.devtest)
// Bridge and build-plan unit tests keep data in game classes (Gson, BlockPos).
neoForge.addModdingDependenciesTo(sourceSets.test)

// A fresh GameTest world each run, as in CI.
tasks.matching { it.name == 'runGameTestServer' }.configureEach { task ->
    doFirst { project.delete(new File(task.gameDirectory.get().asFile, 'world')) }
}

dependencies {
    // GM scripts (Groovy): nested jar in the mod jar (Jar-in-Jar), alongside the game in Gradle runs.
    jarJar(implementation('org.apache.groovy:groovy')) {
        version {
            strictly groovy_range
            prefer groovy_version
        }
    }
    // Gradle runs before 1.21.9 put the game on its own layer and need Groovy there too; from 1.21.9 FML has no
    // extra run classpath and the implementation dependency above is enough.
    if (minecraft_version.startsWith('1.21.1')) additionalRuntimeClasspath "org.apache.groovy:groovy:${groovy_version}"

    // Mod compatibility (compat/<mod>), compile only and absent from the jar and mods.toml; a node without the
    // property has no such module (Stonecutter disables it, stonecutter.gradle). Versions: versions/<node>/gradle.properties.
    // Immersive Aircraft (Modrinth version id): bot aircraft control is called only when the mod is installed.
    if (project.findProperty('compat_ia')) {
        compileOnly "maven.modrinth:immersive-aircraft:${compat_ia}"
        devtestRuntimeOnly "maven.modrinth:immersive-aircraft:${compat_ia}"
    }
    // Claim mods, queried read-only (plan 4.7): Open Parties and Claims (Modrinth version id) and FTB Chunks
    // (chunks:library:teams versions on maven.ftb.dev).
    if (project.findProperty('compat_opac')) compileOnly "maven.modrinth:open-parties-and-claims:${compat_opac}"
    if (project.findProperty('compat_ftbchunks')) {
        def (chunks, library, teams) = compat_ftbchunks.split(':')
        compileOnly("dev.ftb.mods:ftb-chunks-neoforge:${chunks}") { transitive = false }
        compileOnly("dev.ftb.mods:ftb-library-neoforge:${library}") { transitive = false }
        compileOnly("dev.ftb.mods:ftb-teams-neoforge:${teams}") { transitive = false }
    }
    // Sable (Create Aeronautics ships), companion:sable: ships (compat/sable) use its public sable-companion library
    // (MIT, shipped by Sable itself); Sable itself is GameTest-only.
    if (project.findProperty('compat_sable')) {
        def (companion, sable) = compat_sable.split(':')
        compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${companion}"
        devtestCompileOnly "maven.modrinth:sable:${sable}"
        devtestRuntimeOnly "maven.modrinth:sable:${sable}"
    }

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version_range: minecraft_version_range, neo_version: neo_version,
        loader_version_range: loader_version_range, mod_version: mod_version,
        mod_license: mod_license, mod_authors: mod_authors, mod_url: mod_url,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from rootProject.file('src/main/templates')
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// GPL: include a license copy in every jar shipped to servers.
tasks.named('jar', Jar) {
    from(rootProject.file('LICENSE'))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all,-processing,-serial,-classfile,-this-escape', '-Xmaxerrs', '1000']
}
