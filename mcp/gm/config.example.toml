# Ведущий: настройки сервера. Каталог сервера заводит gm.py init (например ~/gm): config.toml из этого образца;
# рядом диспетчер держит gm.db, runs/ и знания сервера в skill/ (git). Значения по умолчанию — conf.py.

[bridge]                      # мост игры (Almighty), только петля
url = "http://127.0.0.1:25650"
token_file = "~/mc-server/gm-token"

[test_bridge]                 # тестовый сервер на копии мира: там наставник пробует рецепты
url = "http://127.0.0.1:25651"
token_file = "~/mc-server/gm-test/token"

[gm]
names = ["ведущий", "ведущая", "ведущему", "ведущего", "ведущим", "ведучий", "ведучому"]   # и всегда — /gm
owners = ["Admin"]
default_language = "ru"
languages = { Taras = "uk" }
# bot_players = ["Tester"]    # репетиция: этих ботов ведущий слушает как игроков (на тестовом сервере)
# plugins = ["plugins/my_checks.py"]   # плагины сервера, пути от этого каталога (README, «Плагины сервера»)

[models]                      # голос — быстрый и дешёвый (выбор — по проверочному набору: gate.py evals)
voice = "haiku"               # у Haiku уровня усилий нет; для sonnet — voice_effort = "low"
worker = "sonnet"
worker_effort = "medium"
teacher = "sonnet"
teacher_effort = "high"
reviewer = "sonnet"
reviewer_effort = "medium"
fallback = "sonnet"

[limits]
workers = 2
task_minutes = 20
teacher_gap_minutes = 10

[guard]                       # только добавить к запретам набора (guard.NEVER, OWNER_ONLY, SCRIPT_NEVER): убрать их нельзя
never = []                    # команды, которых ведущий не даёт никогда (регулярные выражения, без «/»)
owner_only = []               # команды только по слову владельца
script_never = []             # в коде скриптов и правил
