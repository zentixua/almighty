modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "${mod_url}/issues"

# Миксин один: возрождение бота его же классом (mixin/PlayerListMixin) — API для этого нет
[[mixins]]
config = "almighty.mixins.json"

# Только сервер: своих пакетов, блоков и предметов у мода нет, поэтому игрокам он не нужен
[[mods]]
modId = "almighty"
version = "${mod_version}"
displayName = "Almighty"
authors = "${mod_authors}"
displayURL = "${mod_url}"
description = '''An AI game master for your Minecraft server. A server-side bridge through which an AI agent sees the world, follows events and acts on the server: commands, builds with undo, Groovy scripts, rules on game events and bot players. Local HTTP API with a token, plus an MCP adapter. Clients need nothing.'''

[[dependencies.almighty]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.almighty]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
