modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "${mod_url}/issues"

# Только сервер: своих пакетов, блоков и предметов у мода нет, поэтому игрокам он не нужен
[[mods]]
modId = "airstrike_gm"
version = "${mod_version}"
displayName = "Airstrike GM"
authors = "${mod_authors}"
displayURL = "${mod_url}"
description = '''Server-side bridge for the game master: lets an AI game master see the world, follow the game and build on the server through a local HTTP API (no client install).'''

[[dependencies.airstrike_gm]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.airstrike_gm]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
