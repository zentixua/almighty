modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "${mod_url}/issues"

# One mixin: respawn a bot with its own class (mixin/PlayerListMixin); no API exists for this.
[[mixins]]
config = "almighty.mixins.json"

# Server only: no custom packets, blocks or items, so players do not need the mod.
[[mods]]
modId = "almighty"
version = "${mod_version}"
displayName = "Almighty"
authors = "${mod_authors}"
displayURL = "${mod_url}"
logoFile = "almighty.png"
description = '''An AI game master for your Minecraft server. A server-side bridge through which an AI agent sees the world, follows events and acts on the server: commands, builds with undo, Groovy scripts, rules on game events and bot players. Local HTTP API with a token, plus an MCP adapter. Clients need nothing.'''

[[dependencies.almighty]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.almighty]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
