modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "${mod_url}/issues"

# Только сервер: своих пакетов, блоков и предметов у мода нет, поэтому игрокам он не нужен
[[mods]]
modId = "almighty"
version = "${mod_version}"
displayName = "Almighty"
authors = "${mod_authors}"
displayURL = "${mod_url}"
description = '''Almighty AI for your Minecraft server. Server-side bridge for AI agents: lets an AI game master see the world, follow the game and act on the server through a local HTTP API and an MCP adapter (no client install).'''

[[dependencies.almighty]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.almighty]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
